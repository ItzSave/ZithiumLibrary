plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.0.2'
}

group = 'net.zithium.library'
version = '2.1.13'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://libraries.minecraft.net/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:1.5.21'

    // For MiniMessage text formatting.
    implementation "net.kyori:adventure-api:4.24.0"

    // XMaterial, XSound, ReflectionUtils, ActionBar
    implementation("com.github.cryptomorin:XSeries:13.3.3")

    // PlaceholderAPI does not need to be shaded as it's optional.
    compileOnly 'me.clip:placeholderapi:2.11.6'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(17))
}

// Ensure build depends on shadowJar
tasks.build {
    dependsOn(shadowJar)
}
shadowJar {
    archiveFileName = "ZithiumLibrary-${project.version}.jar"

    relocate "com.cryptomorin.xseries", "net.zithium.library.utils.version"
    relocate "net.kyori.adventure", "net.zithium.library.shaded.adventure"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = group
            artifactId = project.name
            version = project.version

            // Publish ONLY the shadow jar
            artifact(tasks.shadowJar) {
                classifier = null // removes "-all"
            }
        }
    }
    repositories {
        maven {
            name = "ZithiumReleases"
            url = uri("https://repo.zithium.net/releases")

            credentials {
                username = project.findProperty("repoUser")
                password = project.findProperty("repoPassword")
            }
        }
    }
}
